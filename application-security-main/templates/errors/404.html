{% extends 'base.html' %}

{% block title %}404 Not Found - Security Shield{% endblock %}

{% block content %}
<div class="container-narrow" style="margin: 3rem auto; text-align: center;">
  <div class="card">
    <h2 style="font-size: 2.2rem; color: var(--accent-cyan); margin-bottom: 0.5rem;">404</h2>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">The requested endpoint or resource does not exist on this server.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Safety</a>
  </div>
</div>
{% endblock %}
